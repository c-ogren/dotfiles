general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# On AC the laptop only locks and blanks; dimming and suspend are battery-only
# so music etc. keeps playing while plugged in.

# Dim the backlight (battery only)
listener {
    timeout = 450
    on-timeout = grep -qx 1 /sys/class/power_supply/AC/online || brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screens off
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

# Suspend (battery only)
listener {
    timeout = 1800
    on-timeout = grep -qx 1 /sys/class/power_supply/AC/online || systemctl suspend
}
