background {
    monitor =
    path = ~/wallpaper/wallpaper.png   # same as swaybg in hyprland.lua

    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    font_family = JetBrainsMono Nerd Font
    size = 350, 65
    outline_thickness = 4
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = false
    font_color = rgb(201, 209, 217)    # #c9d1d9 fg
    inner_color = rgba(13, 17, 23, 0.7) # #0d1117 bg
    outer_color = rgb(88, 166, 255)    # #58a6ff blue, matches active border
    check_color = rgb(210, 153, 34)    # #d29922 yellow while verifying
    fail_color = rgb(255, 123, 114)    # #ff7b72 salmon on failure
    fail_text = <i>✗ $FAIL</i>
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Optional: Add a clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(201, 209, 217, 0.9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰣇 Locked
    color = rgba(201, 209, 217, 0.9)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}


