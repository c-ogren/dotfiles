background {
    monitor =
    path = /usr/share/wallpapers/sddm_wallpaper.png   # Reusing your wallpapers

    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    font_family = JetBrainsMono Nerd Font
    size = 350, 65
    outline_thickness = 4
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = false
    font_color = rgb(200, 200, 200)
    inner_color = rgba(0, 0, 0, 0.5) # Semi-transparent black
    outer_color = rgb(124, 108, 191) # Matching your active border color #7c6cbf
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Optional: Add a clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰣇 Locked
    color = rgba(255, 255, 255, 0.8)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}


