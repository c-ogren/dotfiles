[opener]
image = [
  { run = 'imv %s1', desc = "View Image (imv)", orphan = true }
]
edit = [
  { run = 'nvim %s1', desc = "Edit with Neovim", block = true }
]
pdf = [
  { run = 'zathura %s1', desc = "View PDF", orphan = true }
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "pdf" },
  { mime = "image/*", use = "image" },

  { mime = "text/*", use = "edit" },
  { mime = "application/javascript", use = "edit" },
  { mime = "application/json", use = "edit" },
]


[mgr]
ratio = [1, 4, 3]

[preview]

max_width = 1200
max_height = 1200
image_quality = 80
image_delay = 30
