# ─────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi-style copy mode
setw -g mode-keys vi

# ─────────────────────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ─────────────────────────────────────────────────────────────
# Pane management
# ─────────────────────────────────────────────────────────────

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows inherit cwd
bind c new-window -c "#{pane_current_path}"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─────────────────────────────────────────────────────────────
# Colors
#
# bg      #0D1117
# surface #161B22
# active  #22272E
# border  #444C56
# text    #CDD9E5
# blue    #539BF5
# gold    #C69026
# ─────────────────────────────────────────────────────────────

# Main status bar
set -g status-position bottom
set -g status-style "bg=#0D1117,fg=#CDD9E5"

set -g status-left-length 40
set -g status-right-length 140

# Session name — blue
set -g status-left "#[bg=#539BF5,fg=#0D1117,bold]   #S #[bg=#0D1117,fg=#539BF5]"

# Window list
setw -g window-status-format \
  "#[bg=#161B22,fg=#768390] #I:#W "

setw -g window-status-current-format \
  "#[bg=#22272E,fg=#539BF5,bold] #I:#W "

setw -g window-status-separator " "

# Right side: battery + CPU + RAM + host + time

set -g status-right \
  "#[fg=#C69026]#{?client_prefix, PREFIX ,}\
#[fg=#768390]│ \
#[fg=#CDD9E5]  #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1)% \
#[fg=#444C56]│ \
#[fg=#CDD9E5]  #(top -bn2 -d0.5 | awk '/Cpu\\(s\\)/ {v=100-$8} END {printf \"%.0f%%\", v}') \
#[fg=#444C56]│ \
#[fg=#CDD9E5]  #(free | awk '/Mem:/ {printf \"%.0f%%\", $3/$2*100}') \
#[fg=#444C56]│ \
#[fg=#CDD9E5]#H \
#[fg=#444C56]│ \
#[fg=#539BF5]%H:%M "

# Pane borders
set -g pane-border-style "fg=#444C56"
set -g pane-active-border-style "fg=#539BF5"

# Messages / prompts
set -g message-style "bg=#22272E,fg=#539BF5,bold"
set -g message-command-style "bg=#22272E,fg=#C69026"

# Copy mode / selection
setw -g mode-style "bg=#264F78,fg=#CDD9E5"

# Clock
setw -g clock-mode-colour "#539BF5"

# Bell
setw -g window-status-bell-style "bg=#C69026,fg=#0D1117,bold"

# ─────────────────────────────────────────────────────────────
# QoL
# ─────────────────────────────────────────────────────────────

# Don't rename windows constantly
set -g allow-rename off

# Longer status refresh isn't necessary
set -g status-interval 5

# Better clipboard behavior under Wayland
set -g set-clipboard on

# Copy tmux selection directly to Wayland clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
